[project]
name = "strata-api"
version = "0.1.0"
description = "Strata backend API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "pwdlib[argon2]>=0.2.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
plugins = [
    "pydantic_mypy"
]